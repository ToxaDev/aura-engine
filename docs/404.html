<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Page not found — AuraEngine</title>
<link rel="icon" type="image/png" sizes="64x64" href="/media/aura-icon-64.png">
<style>
  :root { --bg: #070a12; --text: #e6edf7; --dim: #8b98ad; --sky: #38bdf8; --violet: #a78bfa; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(ellipse at 30% 80%, rgba(56, 189, 248, .10), transparent 60%), var(--bg);
    color: var(--text); font: 16px/1.6 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; text-align: center;
  }
  .code { font-family: ui-monospace, Consolas, monospace; letter-spacing: 4px; color: var(--sky); font-size: 14px; }
  h1 { margin: 10px 0 8px; font-size: clamp(26px, 6vw, 40px); }
  p { margin: 0 0 26px; color: var(--dim); }
  nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a {
    color: var(--text); text-decoration: none; padding: 10px 18px; border-radius: 10px;
    border: 1px solid rgba(148, 163, 184, .28); background: rgba(15, 23, 42, .6);
  }
  a:hover { border-color: var(--sky); }
  a.main { background: linear-gradient(90deg, var(--sky), var(--violet)); color: #070a12; font-weight: 600; border: 0; }
  img { width: 48px; height: 48px; }
</style>
</head>
<body>
<main>
  <img src="/media/aura-icon-64.png" alt="" width="48" height="48">
  <div class="code">404</div>
  <h1>This page is not here</h1>
  <p>The link may be old or mistyped. The app and its documentation are one click away.</p>
  <nav>
    <a class="main" href="/">AuraEngine home</a>
    <a href="/docs.html">Documentation</a>
  </nav>
</main>
</body>
</html>
